<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>osu!taiko Hitsound Tester</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <h1>osu!taiko Hitsound Tester</h1>

      <section class="set-area" aria-label="Hitsound sets" id="set-area"></section>

      <section class="song-area" aria-label="Test songs" id="song-area" aria-busy="true">
        <p class="loading-note">曲assetを読み込んでいます…</p>
      </section>

      <section class="playback-area" aria-label="Playback check">
        <div class="disc-panel">
          <div class="disc" role="img" aria-label="Selected song artwork">
            <span class="disc-hole" aria-hidden="true"></span>
            <span class="disc-label">—</span>
          </div>
        </div>

        <div class="right-panel">
          <div class="waveform-panel">
            <canvas class="waveform" width="640" height="250" aria-label="Don and Kat waveform preview"></canvas>
          </div>

          <div class="effect-volume" aria-label="Effect volume">
            <label for="effect-volume-input">Effect Volume</label>
            <input id="effect-volume-input" type="range" min="0" max="100" step="5" value="80" />
            <output id="effect-volume-output" for="effect-volume-input">80%</output>
          </div>

          <div class="player is-paused" data-player-state="paused">
            <button class="play-button" type="button" aria-label="Play" aria-pressed="false" disabled>
              <span class="play-icon" aria-hidden="true">▶</span>
            </button>
            <input class="seek-input" type="range" min="0" max="1" step="0.001" value="0" aria-label="Playback position" disabled />
            <div class="time-row" aria-live="off">
              <time class="current-time" datetime="PT0S">00:00</time>
              <time class="total-time" datetime="PT0S">00:00</time>
            </div>
            <p class="player-status" aria-live="polite">曲とDon/Katを準備してください。</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
