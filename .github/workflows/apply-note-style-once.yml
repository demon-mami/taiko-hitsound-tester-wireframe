name: Apply Confirmed Note Style Once

on:
  push:
    branches:
      - integration/v23-stage5-final-ui-desktop
    paths:
      - tools/apply-note-style.mjs

permissions:
  contents: write

jobs:
  apply-note-style:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Apply note renderer patch
        run: node tools/apply-note-style.mjs
      - name: Install test dependency
        run: npm install
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run practical and desktop gates
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Commit confirmed note style
        run: |
          if git diff --quiet -- script.js README_STAGE5.md; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js README_STAGE5.md
          git commit -m "Refine Object Timeline note style"
          git push
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-note-style-report
          path: playwright-report/
          retention-days: 14
