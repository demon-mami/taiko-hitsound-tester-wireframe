name: Playwright Audio Gate

on:
  push:
    branches:
      - main
      - "integration/**"
  pull_request:

permissions:
  contents: write

jobs:
  practical-audio-gate:
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Apply exact Mobile 1000ms full-span mapping
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/integration/v23-stage6-responsive-2hits') || (github.event_name == 'pull_request' && github.head_ref == 'integration/v23-stage6-responsive-2hits') }}
        run: |
          if grep -q 'const MOBILE_TIMELINE_SPAN_MS = 1000;' script.js; then
            echo "Mobile full-span mapping already applied."
          else
            node tools/apply-mobile-fullspan-1000.mjs
          fi

      - name: Install test dependency
        run: npm install

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run practical audio gate
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Commit exact Mobile 1000ms full-span mapping
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/integration/v23-stage6-responsive-2hits') || (github.event_name == 'pull_request' && github.head_ref == 'integration/v23-stage6-responsive-2hits') }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js tests/mobile-ui.spec.mjs README_STAGE6.md
          git commit -m "Match mobile timeline to 1000ms full-width span"
          git pull --rebase origin integration/v23-stage6-responsive-2hits
          git push origin HEAD:integration/v23-stage6-responsive-2hits

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-audio-report
          path: playwright-report/
          retention-days: 14
