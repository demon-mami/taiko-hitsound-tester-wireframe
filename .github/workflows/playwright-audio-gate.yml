name: Playwright Audio Gate

on:
  push:
    branches:
      - main
      - "integration/**"
  pull_request:

permissions:
  contents: write

jobs:
  practical-audio-gate:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Apply pending confirmed note style
        if: ${{ hashFiles('tools/apply-note-style.mjs') != '' }}
        run: node tools/apply-note-style.mjs

      - name: Install test dependency
        run: npm install

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run practical audio gate
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Commit pending note-style result
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/integration/v23-stage5-final-ui-desktop' }}
        run: |
          if git diff --quiet -- script.js README_STAGE5.md; then
            echo "No renderer patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js README_STAGE5.md
          git commit -m "Refine Object Timeline note style"
          git push

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-audio-report
          path: playwright-report/
          retention-days: 14
